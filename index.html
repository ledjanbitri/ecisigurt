<!DOCTYPE html>  
<html lang="sq">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>POLARIS — Smart Cane & AI Navigation</title>  
<style>  
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');  

*{margin:0;padding:0;box-sizing:border-box;scroll-behavior:smooth;}  
:root{--black:#070707;--black2:#101010;--orange:#b84a13;--orange2:#e06a25;--light:#f3eee8;--gray:#a5a5a5;}  
body{background:var(--black);color:white;font-family:'Inter',sans-serif;overflow-x:hidden;}  
a{text-decoration:none;color:inherit;}  

/* LOADER */  
.loader{position:fixed;inset:0;background:#070707;z-index:99999;display:flex;align-items:center;justify-content:center;animation:loaderOut 1s ease 1.2s forwards;}  
.loader h1{font-size:42px;letter-spacing:8px;font-weight:900;}  
.loader span{color:var(--orange2);}  
@keyframes loaderOut{to{opacity:0;visibility:hidden;}}  

/* NAVBAR */  
nav{position:fixed;top:0;left:0;width:100%;height:80px;z-index:5000;display:flex;align-items:center;justify-content:space-between;padding:0 6%;background:rgba(7,7,7,.9);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.06);}  
.logo{font-size:24px;font-weight:900;letter-spacing:5px;}  
.logo span{color:var(--orange2);}  

/* HAMBURGER MENU */
.menu-toggle{display:flex;flex-direction:column;cursor:pointer;gap:6px;z-index:6000;}  
.menu-toggle span{width:30px;height:3px;background:white;transition:.3s;}  

/* FULLSCREEN MENU DRAWER */
.nav-menu-overlay{position:fixed;top:0;right:-100%;width:100%;max-width:450px;height:100vh;background:rgba(12,12,12,0.98);backdrop-filter:blur(20px);z-index:5500;display:flex;flex-direction:column;justify-content:center;padding:60px;transition:right .4s cubic-bezier(0.77,0,0.175,1);border-left:1px solid #222;}
.nav-menu-overlay.active{right:0;}
.nav-menu-overlay a{font-size:24px;font-weight:800;margin:20px 0;color:#ccc;transition:.3s;}
.nav-menu-overlay a:hover{color:var(--orange2);padding-left:10px;}
.close-menu{position:absolute;top:30px;right:40px;font-size:35px;cursor:pointer;color:#fff;}

/* LEFT FLOATING CHAT BUTTON (3 DOTS) */
.left-chat-btn{position:fixed;left:25px;bottom:30px;z-index:4000;background:var(--orange2);color:white;width:55px;height:55px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;box-shadow:0 10px 30px rgba(224,106,37,0.4);transition:.3s;border:none;}
.left-chat-btn:hover{transform:scale(1.1);background:var(--orange);}

/* FREE CHAT SIDEBAR DRAWER */
.chat-drawer{position:fixed;top:0;left:-100%;width:100%;max-width:420px;height:100vh;background:#111;z-index:7000;display:flex;flex-direction:column;transition:left .4s ease;box-shadow:5px 0 30px rgba(0,0,0,0.8);border-right:1px solid #222;}
.chat-drawer.active{left:0;}
.chat-header{padding:25px;background:#161616;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;}
.chat-header h3{font-size:18px;font-weight:800;letter-spacing:1px;color:var(--orange2);}
.close-chat{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;}

.chat-box{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:15px;background:#0d0d0d;}  
.chat-message{background:#181818;padding:12px 16px;border-radius:8px;max-width:90%;border-left:3px solid var(--orange2);position:relative;}  
.chat-message .user-name{font-size:11px;color:var(--orange2);font-weight:700;margin-bottom:4px;}  
.chat-message .msg-text{font-size:14px;color:#ddd;line-height:1.5;}  
.delete-btn{position:absolute;top:8px;right:10px;background:transparent;border:none;color:#ff4d4d;font-size:14px;cursor:pointer;font-weight:900;}  

.chat-input-area{padding:15px;background:#141414;border-top:1px solid #222;display:flex;flex-direction:column;gap:10px;}  
.chat-input-area input{background:#1c1c1c;border:1px solid #333;padding:10px 12px;border-radius:4px;color:white;font-family:'Inter',sans-serif;outline:none;font-size:13px;}  
.chat-input-area input:focus{border-color:var(--orange2);}  
.chat-input-area button{padding:12px;background:var(--orange2);color:white;border:none;font-weight:800;border-radius:4px;cursor:pointer;transition:.3s;}  
.chat-input-area button:hover{opacity:.85;}  

/* HERO */  
.hero{min-height:100vh;position:relative;display:flex;align-items:center;overflow:hidden;padding:120px 7% 70px;}  
.hero::before{content:"";position:absolute;width:500px;height:500px;background:rgba(184,74,19,.15);filter:blur(120px);border-radius:50%;right:-100px;top:100px;}  
.hero-content{width:55%;position:relative;z-index:2;}  
.small-title{color:var(--orange2);font-size:13px;font-weight:800;letter-spacing:4px;margin-bottom:20px;}  
.hero h1{font-size:clamp(55px,8vw,130px);line-height:.88;font-weight:900;letter-spacing:-5px;}  
.hero h1 span{color:var(--orange2);}  
.hero-description{max-width:520px;color:#aaa;font-size:16px;line-height:1.8;margin:30px 0;}  
.hero-buttons{display:flex;gap:15px;flex-wrap:wrap;}  
.primary-btn,.secondary-btn{padding:16px 28px;border-radius:4px;font-weight:800;font-size:13px;letter-spacing:1px;transition:.3s;cursor:pointer;}  
.primary-btn{background:var(--orange2);color:white;border:none;}  
.primary-btn:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(224,106,37,.3);}  
.secondary-btn{border:1px solid #444;color:#eee;background:transparent;}  
.secondary-btn:hover{border-color:var(--orange2);}  

.hero-image{position:absolute;right:5%;width:40%;height:80%;display:flex;align-items:center;justify-content:center;}  
.hero-image img{width:100%;max-width:480px;border-radius:12px;object-fit:cover;box-shadow:0 25px 50px rgba(0,0,0,.8);border:1px solid #222;}  

/* PRODUCT GALLERY SECTION (3 FOTOS) */  
.product-gallery{padding:130px 8%;background:#0b0b0b;}  
.section-head{margin-bottom:60px;}  
.section-head small{color:var(--orange2);font-weight:800;letter-spacing:3px;}  
.section-head h2{font-size:clamp(38px,5vw,70px);font-weight:900;margin-top:10px;letter-spacing:-2px;}  

.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;}  
.gallery-card{background:#121212;border:1px solid #222;border-radius:8px;overflow:hidden;transition:.3s;}  
.gallery-card:hover{border-color:var(--orange2);transform:translateY(-5px);}  
.gallery-card img{width:100%;height:320px;object-fit:cover;}  
.gallery-info{padding:25px;}  
.gallery-info h3{font-size:20px;font-weight:800;margin-bottom:10px;color:#fff;}  
.gallery-info p{color:#888;font-size:14px;line-height:1.6;}  

/* HOW IT WORKS */  
.how{padding:130px 8%;background:#101010;}  
.steps{margin-top:50px;display:grid;grid-template-columns:repeat(3,1fr);gap:30px;}  
.step-card{background:#161616;border:1px solid #242424;padding:40px 30px;border-radius:8px;}  
.step-num{color:var(--orange2);font-size:24px;font-weight:900;margin-bottom:20px;}  
.step-card h3{font-size:22px;margin-bottom:12px;font-weight:800;}  
.step-card p{color:#888;line-height:1.7;font-size:14px;}  

/* FUTURE OF POLARIS - AI & NAVIGATION */  
.future{padding:130px 8%;background:radial-gradient(circle at 20% 50%,rgba(184,74,19,.12),transparent 40%), #070707;}  
.future-content{max-width:900px;}  
.future h2{font-size:clamp(40px,6vw,75px);font-weight:900;letter-spacing:-3px;line-height:1;margin:20px 0 30px;}  
.future h2 span{color:var(--orange2);}  
.future-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:50px;}  
.future-box{background:#131313;border:1px solid #222;padding:35px;border-radius:8px;}  
.future-box h4{font-size:20px;color:var(--orange2);margin-bottom:15px;font-weight:800;}  
.future-box p{color:#999;line-height:1.8;font-size:15px;}  

/* EMAIL & CONTACT */  
.contact{padding:130px 8%;background:#0d0d0d;text-align:center;}  
.contact h2{font-size:clamp(40px,6vw,80px);font-weight:900;letter-spacing:-3px;}  
.contact p{color:#888;max-width:600px;margin:20px auto 40px;font-size:16px;line-height:1.7;}  

/* FOOTER */  
<footer>  
    <strong>POLARIS</strong>  
    <span>© 2026 POLARIS — Smart Mobility Albania</span>  
    <span>Project Director: Ledjan Bitri</span>  
</footer>  

<!-- FIREBASE & REAL-TIME CHAT SCRIPT -->
<script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCaLRpsCDoo_rWygqLUWZWSbGksbvMdflw",
      authDomain: "polarisd-f1309.firebaseapp.com",
      projectId: "polarisd-f1309",
      storageBucket: "polarisd-f1309.firebasestorage.app",
      messagingSenderId: "630083759421",
      appId: "1:630083759421:web:d3f423dc7f17fe7c5fe954"
    };

    const app = !getApps().length ? initializeApp(firebaseConfig) : getApps()[0];
    const db = getFirestore(app);

    // Toggle Mobile Menu Drawer (3 vijat)
    window.toggleNavMenu = function() {
        document.getElementById('navMenuOverlay').classList.toggle('active');
    }

    // Toggle Left Chat Drawer (3 pikat)
    window.toggleChatDrawer = function() {
        document.getElementById('chatDrawer').classList.toggle('active');
    }

    // Send Message - rregulluar që secili përdorues ruan emrin e tij unik
    window.sendMessage = async function() {
        const userInput = document.getElementById('chatUser');
        const messageInput = document.getElementById('chatMessageInput');  
        
        let userName = userInput.value.trim();
        if(userName === "") {
            userName = "Vizitor";
        }

        let messageText = messageInput.value.trim();  
        if(messageText === "") return;  

        try {
            await addDoc(collection(db, "messages"), {
                user: userName,
                text: messageText,
                time: Date.now()
            });
            messageInput.value = "";  
        } catch (e) {
            console.error("Gabim në dërgim: ", e);
            alert("Dërgimi dështoi. Kontrollo rregullat e Firestore Rules në Firebase Console.");
        }
    }

    document.getElementById('chatMessageInput').addEventListener('keypress', function (e) {  
        if (e.key === 'Enter') { window.sendMessage(); }  
    });

    // Real-time synchronization from Firestore
    onSnapshot(collection(db, "messages"), (snapshot) => {
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = ""; 
        
        let messagesList = [];
        snapshot.forEach((document) => {
            messagesList.push({ id: document.id, ...document.data() });
        });

        // Initialize default welcome message if empty
        if (messagesList.length === 0) {
            addDoc(collection(db, "messages"), {
                user: "Ledjan (Admin)",
                text: "Mirësevini te Free Chat i POLARIS! Shkruani këtu mendimet, problematikat ose sugjerimet tuaja për shkopin inteligjent.",
                time: Date.now()
            });
            return;
        }

        messagesList.sort((a, b) => (a.time || 0) - (b.time || 0));

        messagesList.forEach((data) => {
            const messageDiv = document.createElement('div');  
            messageDiv.classList.add('chat-message');  

            const nameDiv = document.createElement('div');  
            nameDiv.classList.add('user-name');  
            nameDiv.textContent = data.user || "Përdorues";  

            const textDiv = document.createElement('div');  
            textDiv.classList.add('msg-text');  
            textDiv.textContent = data.text || "";  

            const deleteBtn = document.createElement('button');  
            deleteBtn.classList.add('delete-btn');  
            deleteBtn.innerHTML = '&times;';  
            deleteBtn.title = "Fshi mesazhin";  
            deleteBtn.onclick = async function() {  
                try {
                    await deleteDoc(doc(db, "messages", data.id));
                } catch(e) {
                    console.error("Gabim në fshirje:", e);
                }
            };  

            messageDiv.appendChild(nameDiv);  
            messageDiv.appendChild(textDiv);  
            messageDiv.appendChild(deleteBtn);  
            chatBox.appendChild(messageDiv);  
        });
        chatBox.scrollTop = chatBox.scrollHeight;  
    }, (error) => {
        console.error("Gabim në marrjen e mesazheve:", error);
    });
            rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /messages/{document=**} {
      allow read, write: if true;
    }
  }
}

</script>  

</body>  
</html>
