function escapeHtml(value){
  return String(value ?? "").replace(
    /[&<>"']/g,
    c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );
}

async function getAnonymousName(){

  if(saved) return saved;

  const result=await supabase.rpc(
    "next_polaris_chat_anon"
  );

  if(
    !result.error &&
    result.data!==null &&
    result.data!==undefined
  ){
    const name=String(result.data);

    sessionStorage.setItem(
      "polaris_anon_name",

    );

  }

    Math.floor(Math.random()*900000)+100000
  );

    "polaris_anon_name",
    fallback
  );

/* =========================
   MEDIA
========================= */

function renderMedia(message){

  if(!message.media_url) return "";

  const url=escapeHtml(message.media_url);
  const type=String(message.media_type||"");

  if(type.startsWith("image/")){
    return `
      <div class="message-media">
        <a href="${url}" target="_blank" rel="noopener">
          <img
            src="${url}"
            alt="Foto"
            loading="lazy"
          >
        </a>
      </div>
    `;
  }

  if(type.startsWith("video/")){
    return `
      <div class="message-media">
        <video
          controls
          preload="metadata"
          playsinline
        >
          <source
            src="${url}"
            type="${escapeHtml(type)}"
          >
        </video>
      </div>
    `;
  }

  if(type.startsWith("audio/")){
    return `
      <div class="voice-message">
        <audio controls preload="metadata">
          <source
            src="${url}"
            type="${escapeHtml(type)}"
          >
        </audio>
      </div>
      <div class="voice-label">
        🎤 Voice message
      </div>
    `;
  }

  return "";
}

/* =========================
   RENDER ONE MESSAGE
========================= */

function renderOneMessage(message){

  const isAdmin=
    message.user_name==="Ledjan Bitri";

  const isMine=
    adminMode
      ? isAdmin
      : message.user_name===anonymousName;

  const name=isAdmin
    ? "Ledjan Bitri · ADMIN"
    : "Përdoruesi "+escapeHtml(message.user_name);

  const text=escapeHtml(message.message||"");

  return `
    <div
      class="msg ${isMine?"mine":""} ${isAdmin?"admin":""}"
      data-message-id="${escapeHtml(message.id)}"
    >

      <div class="meta">
        ${name}

        ${
          adminMode
          ? `
            <button
              class="delete-msg"
              data-delete="${escapeHtml(message.id)}"
              type="button"
            >
              Fshi
            </button>
          `
          :""
        }
      </div>

      ${
        text
        ? `<div class="text">${text}</div>`
        :""
      }

      ${renderMedia(message)}

      ${
        isMine
        ? `<span class="sent-status">✓ Dërguar</span>`
        :""
      }

    </div>
  `;
}

/* =========================
   LOAD
========================= */

async function loadMessages(){

  const container=$("messages");

  const result=await supabase
    .from("polaris_messages")
    .select(
      "id,user_name,message,created_at,media_url,media_type,media_name"
    )
    .order(
      "created_at",
      {ascending:true}
    );

  if(result.error){

    console.error(result.error);

    container.innerHTML=`
      ${getWelcome()}
      <div class="chat-welcome">
        Chat-i nuk u lidh. Provo përsëri.
      </div>
    `;

    return;
  }

  let html=getWelcome();

  if(!result.data.length){

    html+=`
      <div class="chat-welcome">
        Bëhu i pari që nis bisedën.
      </div>
    `;

  }else{

    html+=result.data
      .map(renderOneMessage)
      .join("");

  }

  html+=`
    <div
      class="typing-wrap"
      id="typingIndicator"
    >
      <div class="typing-bubble">
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
      </div>
    </div>
  `;

  container.innerHTML=html;

  container.scrollTop=container.scrollHeight;
}

/* =========================
   REALTIME
========================= */

async function setupRealtime(){

  if(realtimeChannel){

    await supabase.removeChannel(
      realtimeChannel
    );

  }

  realtimeChannel=supabase
    .channel("polaris-community-chat")
    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"polaris_messages"
      },
      payload=>{

        const existing=document.querySelector(
          `[data-message-id="${CSS.escape(String(payload.new.id))}"]`
        );

        if(existing) return;

        const typing=$("typingIndicator");

        if(typing){
          typing.insertAdjacentHTML(
            "beforebegin",
            renderOneMessage(payload.new)
          );
        }else{
          $("messages").insertAdjacentHTML(
            "beforeend",
            renderOneMessage(payload.new)
          );
        }

        $("messages").scrollTop=
          $("messages").scrollHeight;
      }
    )
    .on(
      "postgres_changes",
      {
        event:"DELETE",
        schema:"public",
        table:"polaris_messages"
      },
      payload=>{

        const item=document.querySelector(
          `[data-message-id="${CSS.escape(String(payload.old.id))}"]`
        );

        if(item){
          item.remove();
        }

      }
    )
    .subscribe(status=>{
      console.log(
        "POLARIS realtime:",
        status
      );
    });
}

/* =========================
   UPLOAD MEDIA
========================= */

async function uploadMedia(file){

  if(!file) return null;

  if(
    !file.type.startsWith("image/") &&
    !file.type.startsWith("video/")
  ){
    throw new Error(
      "Lejohen vetëm foto dhe video."
    );
  }

  if(file.size>MAX_MEDIA_SIZE){
    throw new Error(
      "File-i është shumë i madh. Maksimumi është 50 MB."
    );
  }

  const extension=
    (file.name.split(".").pop()||"file")
    .toLowerCase()
    .replace(/[^a-z0-9]/g,"");

  const path=
    "community/"+
    Date.now()+
    "-"+
    Math.random().toString(36).slice(2)+
    "."+
    extension;

  const upload=await supabase
    .storage
    .from(MEDIA_BUCKET)
    .upload(
      path,
      file,
      {
        cacheControl:"3600",
        upsert:false,
        contentType:file.type
      }
    );

  if(upload.error){
    console.error(upload.error);
    throw new Error(
      "Fotoja ose videoja nuk u ngarkua."
    );
  }

  const publicUrl=
    supabase
      .storage
      .from(MEDIA_BUCKET)
      .getPublicUrl(path);

  return {
    url:publicUrl.data.publicUrl,
    type:file.type,
    name:file.name
  };
}

    const data={

      message:text

    if(mediaData){

        mediaData.url;

      data.media_type=
        mediaData.type;

      data.media_name=
        mediaData.name;
    }

    const result=await supabase
      .from("polaris_messages")
      .insert(data);

    if(result.error){
      throw new Error(
        "Mesazhi nuk u dërgua."
      );
    }

    input.value="";
    input.style.height="46px";

    clearSelectedMedia();
    stopTyping();

    await loadMessages();

  }catch(error){

    console.error(error);

    alert(
      error.message||
      "Mesazhi nuk u dërgua."
    );

  }finally{

    updateSendButton();

  }
}

/* =========================
   VOICE RECORDING
========================= */

function formatTime(seconds){

  const m=Math.floor(seconds/60);
  const s=seconds%60;

  return m+":"+
    String(s).padStart(2,"0");
}

function startRecordingTimer(){

  recordingSeconds=0;

  $("recordingTime").textContent="0:00";

  recordingTimer=setInterval(
    ()=>{
      recordingSeconds++;

      $("recordingTime").textContent=
        formatTime(recordingSeconds);
    },
    1000
  );
}

function stopRecordingTimer(){

  clearInterval(recordingTimer);

  recordingTimer=null;
}

async function startRecording(){

  if(recordingStarted) return;

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    alert(
      "Shfletuesi nuk mbështet regjistrimin audio."
    );

    return;
  }

  try{

    recordingStream=
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });

    const formats=[
      "audio/webm;codecs=opus",
      "audio/webm",
      "audio/ogg;codecs=opus",
      "audio/mp4"
    ];

    let mimeType="";

    for(const format of formats){

      if(
        MediaRecorder.isTypeSupported(format)
      ){
        mimeType=format;
        break;
      }
    }

    mediaRecorder=
      mimeType
        ? new MediaRecorder(
            recordingStream,
            {mimeType}
          )
        : new MediaRecorder(
            recordingStream
          );

    audioChunks=[];
    recordingStarted=true;

    mediaRecorder.ondataavailable=
      event=>{

        if(event.data.size>0){
          audioChunks.push(
            event.data
          );
        }

      };

    mediaRecorder.onstop=
      async ()=>{

        const type=
          mediaRecorder.mimeType||
          "audio/webm";

        const blob=
          new Blob(
            audioChunks,
            {type}
          );

        recordingStream
          ?.getTracks()
          .forEach(
            track=>track.stop()
          );

        recordingStream=null;

        recordingStarted=false;

        $("recordBtn")
          .classList
          .remove("active");

        $("recordingStatus")
          .classList
          .remove("show");

        stopRecordingTimer();

        if(blob.size>0){

          await sendVoiceMessage(
            blob,
            type
          );
        }
      };

    mediaRecorder.start();

    $("recordBtn")
      .classList.add("active");

    $("recordingStatus")
      .classList.add("show");

    startRecordingTimer();

  }catch(error){

    console.error(error);

    recordingStarted=false;

    recordingStream
      ?.getTracks()
      .forEach(
        track=>track.stop()
      );

    recordingStream=null;

    alert(
      "Lejo aksesin e mikrofonit për të dërguar voice message."
    );
  }
}

function stopRecording(){

  if(
    !recordingStarted ||
    !mediaRecorder
  ){
    return;
  }

  if(
    mediaRecorder.state!=="inactive"
  ){
    mediaRecorder.stop();
  }
}

async function sendVoiceMessage(blob,type){

  try{

    const extension=
      type.includes("ogg")
        ? "ogg"
        : "webm";

    const file=new File(
      [blob],
      "voice-"+Date.now()+"."+extension,
      {type}
    );

    const path=
      "community/voice-"+
      Date.now()+
      "-"+
      Math.random().toString(36).slice(2)+
      "."+
      extension;

    const upload=
      await supabase
        .storage
        .from(MEDIA_BUCKET)
        .upload(
          path,
          file,
          {
            cacheControl:"3600",
            upsert:false,
            contentType:type
          }
        );

    if(upload.error){

      console.error(upload.error);

      throw new Error(
        "Voice message nuk u ngarkua."
      );
    }

    const publicUrl=
      supabase
        .storage
        .from(MEDIA_BUCKET)
        .getPublicUrl(path);

    const userName=
      adminMode
        ? "Ledjan Bitri"
        : anonymousName;

    const result=
      await supabase
        .from("polaris_messages")
        .insert({
          user_name:userName,
          message:"",
          media_url:
            publicUrl.data.publicUrl,
          media_type:type,
          media_name:file.name
        });

    if(result.error){

      throw new Error(
        "Voice message nuk u dërgua."
      );
    }

    await loadMessages();

  }catch(error){

    console.error(error);

    alert(
      error.message||
      "Voice message nuk u dërgua."
    );
  }
}

  const password=
    $("registerPassword").value;

  $("registerError").textContent="";
  $("registerSuccess").classList.remove("show");

  if(!email){

    $("registerError").textContent=
      "Vendos email-in.";

    return;
  }

  if(password.length<6){

    $("registerError").textContent=
      "Passwordi duhet të ketë të paktën 6 karaktere.";

    return;
  }

  $("registerBtn").disabled=true;

  const result=
    await supabase.auth.signUp({
      email,
      password
    });

  $("registerBtn").disabled=false;

  if(result.error){

    const message=
      String(result.error.message||"")
      .toLowerCase();

    $("registerError").textContent=
      message.includes("already")||
      message.includes("registered")
      ? "Ky email është tashmë i regjistruar."
      : "Regjistrimi nuk u krye. Kontrollo të dhënat.";

    return;
  }

  if(result.data?.user){

    await supabase
      .from("polaris_profiles")
      .upsert({
        id:result.data.user.id,
        email
      });
  }

  $("registerEmail").value="";
  $("registerPassword").value="";

  $("registerSuccess")
    .classList.add("show");

  setTimeout(
    ()=>{
      $("registerModal")
        .classList.remove("show");

      $("registerSuccess")
        .classList.remove("show");
    },
    1800
  );
}

$("registerBtn").onclick=registerUser;

$("cancelRegister").onclick=()=>{
  $("registerModal")
    .classList.remove("show");
};

/* =========================
   ADMIN MENU
========================= */

$("menuAdmin").onclick=()=>{

  $("chatMenu")
    .classList.remove("show");

  if(adminMode) return;

  $("adminError").textContent="";
  $("adminPassword").value="";

  $("adminModal")
    .classList.add("show");

  setTimeout(
    ()=>$("adminPassword").focus(),
    50
  );
};

$("cancelAdmin").onclick=()=>{
  $("adminModal")
    .classList.remove("show");
};

$("loginAdmin").onclick=loginAdmin;

$("adminPassword").addEventListener(
  "keydown",
  event=>{
    if(event.key==="Enter"){
      loginAdmin();
    }
  }
);

$("logoutAdmin").onclick=
  logoutAdmin;

/* =========================
   SEND
========================= */

$("sendBtn").onclick=
  sendMessage;

/* =========================
   ATTACH
========================= */

$("attachBtn").onclick=()=>{
  $("mediaInput").click();
};

$("mediaInput").onchange=
  event=>{

    const file=
      event.target.files?.[0];

    if(!file) return;

    if(
      !file.type.startsWith("image/") &&
      !file.type.startsWith("video/")
    ){

      alert(
        "Mund të dërgosh vetëm foto ose video."
      );

      clearSelectedMedia();

      return;
    }

    if(file.size>MAX_MEDIA_SIZE){

      alert(
        "File-i është shumë i madh. Maksimumi është 50 MB."
      );

      clearSelectedMedia();

      return;
    }

    showMediaPreview(file);
  };

$("removeMedia").onclick=
  clearSelectedMedia;

/* =========================
   TEXT
========================= */

$("messageInput").addEventListener(
  "input",
  ()=>{

    const input=$("messageInput");

    input.style.height="46px";

    input.style.height=
      Math.min(
        input.scrollHeight,
        130
      )+"px";

    if(input.value.trim()){
      startTyping();
    }else{
      stopTyping();
    }

    updateSendButton();
  }
);

$("messageInput").addEventListener(
  "keydown",
  event=>{

    if(
      event.key==="Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();
    }
  }
);

/* =========================
   DELETE
========================= */

$("messages").addEventListener(
  "click",
  event=>{

    const button=
      event.target.closest(
        "[data-delete]"
      );

    if(button){

      deleteMessage(
        button.dataset.delete
      );
    }
  }
);

/* =========================
   MODALS
========================= */

$("registerModal").onclick=
  event=>{

    if(
      event.target===
      $("registerModal")
    ){
      $("registerModal")
        .classList.remove("show");
    }
  };

$("adminModal").onclick=
  event=>{

    if(
      event.target===
      $("adminModal")
    ){
      $("adminModal")
        .classList.remove("show");
    }
  };

/* =========================
   ESC
========================= */

document.addEventListener(
  "keydown",
  event=>{

    if(event.key!=="Escape") return;

    $("registerModal")
      .classList.remove("show");

    $("adminModal")
      .classList.remove("show");

    $("chatMenu")
      .classList.remove("show");

    $("emojiPicker")
      .classList.remove("show");
  }
);

/* =========================
   INIT
========================= */

(async function(){

  try{

    setupEmojiPicker();

    anonymousName=
      await getAnonymousName();

    await refreshIdentity();

    await loadMessages();

    await setupRealtime();

  }catch(error){

    console.error(
      "POLARIS initialization:",
      error
    );

  }

})();

})();
</script>
