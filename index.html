<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POLARIS — Admin Panel</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#070707;
    color:white;
    font-family:'Inter',sans-serif;
    min-height:100vh;
}

/* LOGIN */

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:#111;
    border:1px solid #292929;
    border-radius:12px;
    padding:40px;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
}

.logo{
    font-size:28px;
    font-weight:900;
    letter-spacing:5px;
    margin-bottom:8px;
}

.logo span{
    color:#e06a25;
}

.login-box h2{
    margin-top:30px;
    margin-bottom:10px;
    font-size:25px;
}

.login-box p{
    color:#777;
    font-size:14px;
    margin-bottom:25px;
}

input{
    width:100%;
    background:#1a1a1a;
    border:1px solid #333;
    color:white;
    padding:14px;
    border-radius:6px;
    margin-bottom:12px;
    outline:none;
}

input:focus{
    border-color:#e06a25;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:6px;
    background:#e06a25;
    color:white;
    font-weight:800;
    cursor:pointer;
}

button:hover{
    opacity:.85;
}

#error{
    color:#ff5555;
    font-size:13px;
    margin-top:15px;
    display:none;
}

/* ADMIN */

#adminPanel{
    display:none;
    min-height:100vh;
}

header{
    height:75px;
    padding:0 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #222;
    background:#0c0c0c;
    position:sticky;
    top:0;
    z-index:100;
}

header .title{
    font-weight:900;
    letter-spacing:3px;
}

header .title span{
    color:#e06a25;
}

.logout{
    width:auto;
    padding:10px 18px;
    background:#222;
    font-size:12px;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:45px 5%;
}

.dashboard-title{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:20px;
    margin-bottom:30px;
}

.dashboard-title h1{
    font-size:clamp(35px,6vw,65px);
    line-height:1;
    font-weight:900;
}

.dashboard-title p{
    color:#777;
    margin-top:10px;
}

.refresh{
    width:auto;
    padding:12px 18px;
    background:#181818;
    border:1px solid #333;
}

.messages{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.message{
    background:#111;
    border:1px solid #242424;
    border-radius:9px;
    padding:20px;
    position:relative;
}

.message:hover{
    border-color:#e06a25;
}

.message-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:10px;
}

.username{
    color:#e06a25;
    font-weight:800;
    font-size:14px;
}

.date{
    color:#555;
    font-size:11px;
}

.message-text{
    color:#ddd;
    line-height:1.6;
    font-size:14px;
    padding-right:45px;
}

.delete{
    position:absolute;
    right:18px;
    top:18px;
    width:auto;
    padding:7px 11px;
    background:#261313;
    color:#ff5555;
    font-size:12px;
}

.empty{
    text-align:center;
    padding:70px 20px;
    background:#111;
    border:1px dashed #333;
    border-radius:9px;
    color:#666;
}

.status{
    color:#777;
    font-size:12px;
    margin-top:10px;
}

@media(max-width:600px){

    .login-box{
        padding:30px 22px;
    }

    header{
        padding:0 20px;
    }

    .container{
        padding:30px 20px;
    }

    .dashboard-title{
        align-items:flex-start;
        flex-direction:column;
    }

    .refresh{
        width:100%;
    }

    .message-top{
        flex-direction:column;
        align-items:flex-start;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

    <div class="login-box">

        <div class="logo">
            POLARIS<span>.</span>
        </div>

        <h2>Admin Panel</h2>

        <p>
            Hyr vetëm me llogarinë e administratorit.
        </p>

        <input
            type="email"
            id="email"
            placeholder="Email">

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button onclick="login()">
            HYR NË PANEL
        </button>

        <div id="error"></div>

    </div>

</div>


<!-- ADMIN PANEL -->

<div id="adminPanel">

    <header>

        <div class="title">
            POLARIS<span>.</span> ADMIN
        </div>

        <button
            class="logout"
            onclick="logout()">
            DIL
        </button>

    </header>


    <main class="container">

        <div class="dashboard-title">

            <div>

                <h1>
                    MESAZHET
                </h1>

                <p>
                    Menaxho Community Chat të POLARIS.
                </p>

                <div
                    class="status"
                    id="status">
                    Duke ngarkuar...
                </div>

            </div>

            <button
                class="refresh"
                onclick="loadMessages()">
                ↻ RIFRESKO
            </button>

        </div>


        <div
            class="messages"
            id="messages">

        </div>

    </main>

</div>


<script type="module">

import {
    createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/*
==================================================
SUPABASE
==================================================

Përdor të njëjtin URL dhe ANON/PUBLISHABLE KEY
që përdor index.html.

MOS vendos service_role key.
*/

const SUPABASE_URL =
    "VENDOS_SUPABASE_URL";

const SUPABASE_ANON_KEY =
    "VENDOS_SUPABASE_ANON_KEY";


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* ELEMENTS */

const loginScreen =
    document.getElementById("loginScreen");

const adminPanel =
    document.getElementById("adminPanel");

const errorBox =
    document.getElementById("error");


/* LOGIN */

window.login = async function(){

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;


    errorBox.style.display = "none";


    if(!email || !password){

        errorBox.textContent =
            "Plotëso email-in dhe password-in.";

        errorBox.style.display = "block";

        return;
    }


    const {
        error
    } =
    await supabase.auth.signInWithPassword({

        email:email,

        password:password

    });


    if(error){

        errorBox.textContent =
            "Email ose password i gabuar.";

        errorBox.style.display = "block";

        return;
    }


    showAdmin();

};


/* LOGOUT */

window.logout = async function(){

    await supabase.auth.signOut();

    adminPanel.style.display = "none";

    loginScreen.style.display = "flex";

};


/* SHOW ADMIN */

function showAdmin(){

    loginScreen.style.display = "none";

    adminPanel.style.display = "block";

    loadMessages();

}


/* LOAD MESSAGES */

window.loadMessages = async function(){

    const messagesContainer =
        document.getElementById("messages");

    const status =
        document.getElementById("status");


    status.textContent =
        "Duke ngarkuar mesazhet...";


    const {
        data,
        error
    } =
    await supabase
        .from("messages")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        status.textContent =
            "Gabim në marrjen e mesazheve.";

        return;
    }


    messagesContainer.innerHTML = "";


    if(!data || data.length === 0){

        messagesContainer.innerHTML = `

            <div class="empty">

                Nuk ka mesazhe.

            </div>

        `;

        status.textContent =
            "0 mesazhe";

        return;

    }


    status.textContent =
        data.length +
        " mesazhe";


    data.forEach(message => {

        const item =
            document.createElement("div");

        item.className =
            "message";


        const date =
            message.created_at
            ? new Date(
                message.created_at
              ).toLocaleString(
                "sq-AL"
              )
            : "";


        item.innerHTML = `

            <div class="message-top">

                <div class="username">
                    ${escapeHTML(
                        message.user_name ||
                        "Vizitor"
                    )}
                </div>

                <div class="date">
                    ${date}
                </div>

            </div>

            <div class="message-text">
                ${escapeHTML(
                    message.message || ""
                )}
            </div>

            <button
                class="delete"
                data-id="${message.id}">
                FSHI
            </button>

        `;


        item
            .querySelector(".delete")
            .addEventListener(
                "click",
                () => deleteMessage(message.id)
            );


        messagesContainer.appendChild(item);

    });

}


/* DELETE */

async function deleteMessage(id){

    const confirmed =
        confirm(
            "Je i sigurt që do ta fshish këtë mesazh?"
        );


    if(!confirmed){
        return;
    }


    const {
        error
    } =
    await supabase
        .from("messages")
        .delete()
        .eq("id", id);


    if(error){

        alert(
            "Mesazhi nuk u fshi."
        );

        console.error(error);

        return;

    }


    loadMessages();

}


/* SECURITY */

function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* SESSION CHECK */

const {
    data
} =
await supabase.auth.getSession();


if(data.session){

    showAdmin();

}


/* AUTH LISTENER */

supabase.auth.onAuthStateChange(
    (event, session) => {

        if(session){

            showAdmin();

        }else{

            adminPanel.style.display =
                "none";

            loginScreen.style.display =
                "flex";

        }

    }
);


/* REALTIME */

supabase
    .channel("admin-messages")
    .on(
        "postgres_changes",
        {
            event:"*",
            schema:"public",
            table:"messages"
        },
        function(){

            loadMessages();

        }
    )
    .subscribe();

</script>

</body>
